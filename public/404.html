<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Sennett Lau</title>
    <meta name="description" content="Page not found." />
    <style>
      :root {
        --bg: #efe8db;
        --fg: #2e2a2a;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem 1rem;
        gap: 1rem;
      }
      h1 {
        margin: 0;
        font-size: clamp(3rem, 12vw, 8rem);
        line-height: 1;
      }
      p {
        margin: 0;
        font-size: 1.25rem;
      }
      a {
        color: var(--fg);
        text-decoration: underline;
        font-size: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>This page could not be found.</p>
      <a href="/">Back home</a>
    </main>
  </body>
</html>
